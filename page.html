<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
        }

        .login-box{
            width:350px;
            padding:40px;
            background:rgba(255,255,255,0.1);
            border-radius:20px;
            backdrop-filter:blur(10px);
            box-shadow:0 8px 32px rgba(0,0,0,0.2);
            text-align:center;
            color:white;
        }

        .login-box h1{
            margin-bottom:30px;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            outline:none;
            font-size:16px;
        }

        .login-btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:white;
            color:#764ba2;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .login-btn:hover{
            transform:scale(1.05);
        }

        .bottom-text{
            margin-top:20px;
            font-size:14px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Login</h1>

        <div class="input-box">
            <input type="text" placeholder="Enter Username">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Enter Password">
        </div>

        <button class="login-btn">Login</button>

        <div class="bottom-text">
            Welcome to my stylish login page 🚀
        </div>

    </div>

</body>
</html>
